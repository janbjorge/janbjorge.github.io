<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.url != '/' %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
{%- comment -%}
  Synchronous on purpose: it must set data-theme on <html> before first paint
  or dark-mode visitors get a white flash.
{%- endcomment %}
<script src="{{ '/assets/theme.js' | relative_url }}"></script>
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;850&display=swap">
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
<header class="site-header">
  <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <nav class="site-nav" aria-label="Main navigation">
    <a href="{{ '/' | relative_url }}">Blog</a>
    <a href="https://github.com/janbjorge">GitHub</a>
    <button class="btn small ghost theme-icon" type="button" data-theme-toggle
            aria-label="Switch color theme"></button>
  </nav>
</header>
<main class="page">
{{ content }}
<footer class="page-foot">
  <span>{{ site.title }}</span>
  <a href="https://github.com/janbjorge">github.com/janbjorge</a>
</footer>
</main>
</body>
</html>
